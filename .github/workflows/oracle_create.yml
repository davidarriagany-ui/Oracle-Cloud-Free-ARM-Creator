name: Oracle Cloud Free ARM Creator (Ubuntu Minimal)

on:
  schedule:
    - cron: '*/15 * * * *'   # Retry every 15 min until Oracle has A1.Flex capacity
  workflow_dispatch:          # Allows manually triggering from the Actions tab

jobs:
  create_instance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Prepare SSH Public Key File
        run: |
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ~/instance_ssh_key.pub
          chmod 600 ~/instance_ssh_key.pub

      - name: Install OCI CLI
        run: pip install --upgrade oci-cli

      # The OCI CLI's environment-variable auth (OCI_CLI_USER etc.) is
      # unreliable in practice: the CLI still checks for a config file at
      # ~/.oci/config by default, and if one exists but is incomplete, it
      # errors out instead of falling back to env vars. Writing a real
      # config file — the approach Oracle's own docs recommend for CI —
      # avoids that entirely.
      #
      # The private key itself is written to its own file with strict
      # permissions (600), since OCI CLI requires "key_file" to be a path,
      # not the raw key content, when using a config file.
      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          # Using printf (one line per key) instead of a heredoc, since a
          # heredoc here would inherit this YAML block's leading
          # whitespace, and Python's configparser treats indented lines
          # as continuations of the previous value rather than new keys —
          # that would silently corrupt the file.
          printf '[DEFAULT]\n' > ~/.oci/config
          printf 'user=%s\n' "${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          printf 'fingerprint=%s\n' "${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          printf 'tenancy=%s\n' "${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          printf 'region=%s\n' "${{ secrets.OCI_REGION }}" >> ~/.oci/config
          printf 'key_file=%s\n' "$HOME/.oci/oci_api_key.pem" >> ~/.oci/config
          chmod 600 ~/.oci/config

      # All the actual multi-step logic (variable assignment, conditionals,
      # loops) runs as a normal bash script, with the oci CLI already on
      # PATH and authenticated via the ~/.oci/config file written above.
      - name: Find Image and Launch Instance
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_OCID }}
        run: |
          set -e  # Fail fast on any unexpected error

          DISPLAY_NAME="Free-Ubuntu-24-04-Minimal"

          # --- Step 1: Skip everything if the instance already exists ---
          # Prevents duplicate launches (and quota exhaustion) once we've
          # already succeeded once. Only counts non-terminated instances.
          EXISTING_ID=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "$DISPLAY_NAME" \
            --query "data[?\"lifecycle-state\" != 'TERMINATED'].id | [0]" \
            --raw-output)

          if [ "$EXISTING_ID" != "null" ] && [ -n "$EXISTING_ID" ]; then
            echo "Instance already exists ($EXISTING_ID). Nothing to do."
            exit 0
          fi

          # --- Step 2: Resolve the latest Ubuntu 24.04 Minimal ARM image ---
          echo "Finding the latest Canonical Ubuntu 24.04 Minimal ARM image..."
          IMAGE_ID=$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --query "data[?contains(\"display-name\", 'Minimal-aarch64')].id | [0]" \
            --raw-output)

          # Fallback: some regions don't publish a "Minimal" variant.
          if [ "$IMAGE_ID" == "null" ] || [ -z "$IMAGE_ID" ]; then
            echo "No Minimal image found. Falling back to any 24.04 ARM image..."
            IMAGE_ID=$(oci compute image list \
              --compartment-id "$COMPARTMENT_ID" \
              --operating-system "Canonical Ubuntu" \
              --operating-system-version "24.04" \
              --query "data[?contains(\"display-name\", 'aarch64')].id | [0]" \
              --raw-output)
          fi

          if [ "$IMAGE_ID" == "null" ] || [ -z "$IMAGE_ID" ]; then
            echo "Error: No suitable image found. Aborting."
            exit 1
          fi
          echo "Resolved Image ID: $IMAGE_ID"

          # --- Step 3: Try every availability domain in the region ---
          # A1.Flex capacity is scarce and varies AD-by-AD, so looping
          # through all of them in one run gives a much higher success
          # rate than only trying the first one.
          AD_LIST=$(oci iam availability-domain list \
            --compartment-id "$COMPARTMENT_ID" \
            --query "data[].name" --raw-output | tr -d '[]"' | tr ',' '\n')

          LAUNCHED=false
          for AD in $AD_LIST; do
            echo "Attempting launch in availability domain: $AD"
            if oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$SUBNET_ID" \
              --display-name "$DISPLAY_NAME" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file ~/instance_ssh_key.pub \
              --assign-public-ip true; then
              echo "Success! Instance launched in $AD."
              LAUNCHED=true
              break
            else
              echo "Launch failed in $AD (likely out of capacity). Trying next AD..."
            fi
          done

          if [ "$LAUNCHED" = false ]; then
            echo "No capacity available in any AD this run. Will retry on next schedule."
            exit 1
          fi
